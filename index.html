<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CLE MTB Trails</title>
		<script>
			// Apply saved/preferred theme before paint to avoid a flash of the wrong palette.
			// A browser with site data blocked throws on the read, and an uncaught error
			// here would leave the page unthemed, so fall back to the media query.
			(function () {
				var saved = null;
				try {
					saved = localStorage.getItem('theme');
				} catch {
					// Storage blocked: saved stays null and the media query decides.
				}
				var theme =
					saved === 'dracula' || saved === 'alucard'
						? saved
						: window.matchMedia('(prefers-color-scheme: light)').matches
							? 'alucard'
							: 'dracula';
				document.documentElement.dataset.theme = theme;
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
