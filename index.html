<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Is the trail open? Two dozen mountain bike trails around Cleveland on one page, with conditions, weather and directions."
		/>
		<!-- The color of the browser chrome around the page, kept in step by App.tsx. -->
		<meta name="theme-color" content="#282a36" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<!-- Home-screen details for iOS, which takes less from the manifest than the others. -->
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="CLE MTB Trails" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<title>CLE MTB Trails</title>
		<script>
			// Apply the saved or preferred theme before paint.
			(function () {
				var saved = null;
				try {
					saved = localStorage.getItem('theme');
				} catch {
					// Storage blocked: saved stays null and the media query decides.
				}
				var theme =
					saved === 'dracula' || saved === 'alucard'
						? saved
						: window.matchMedia('(prefers-color-scheme: light)').matches
							? 'alucard'
							: 'dracula';
				document.documentElement.dataset.theme = theme;
				// The page backgrounds from index.css, for the browser chrome.
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', theme === 'alucard' ? '#fffbeb' : '#282a36');
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
