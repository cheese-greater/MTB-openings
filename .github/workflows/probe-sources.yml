name: Probe scrape sources

# Diagnostic only: finds which source stopped answering. A probe/* branch commits the report.

on:
    push:
        branches: ['probe/**']
    workflow_dispatch:

permissions:
    contents: write

jobs:
    probe:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Install dependencies
              run: |
                  corepack enable
                  yarn install --immutable

            - name: Probe the sources
              id: probe
              continue-on-error: true
              run: yarn probe

            - name: Publish the report
              if: always()
              run: cat probe-report.md >> "$GITHUB_STEP_SUMMARY"

            # Only on a probe branch; force-added because the report is gitignored.
            - name: Commit the report to the probe branch
              if: always() && startsWith(github.ref, 'refs/heads/probe/')
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -f probe-report.md
                  git diff --cached --quiet || git commit -m 'Source probe report from CI [skip ci]'
                  git push

            - name: Fail if a source was blocked
              if: steps.probe.outcome != 'success'
              run: |
                  echo 'A source did not serve the markup the scraper needs. See the summary above.'
                  exit 1
