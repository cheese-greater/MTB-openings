name: Tests

# Unit tests for the scraper logic and browser tests for the page, on every push
# and pull request. Deliberately a separate workflow from pages.yml: that one
# runs hourly to refresh the data, and installing a browser on each of those
# runs would cost a minute of runner time twenty four times a day to test an
# app that has not changed. The hourly data commit touches only trails.json and
# is marked [skip ci], so it never triggers this either.

on:
    push:
        branches: [master]
        paths-ignore: [public/trails.json]
    pull_request:

permissions:
    contents: read

# A newer push supersedes a run still going on the same branch.
concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
              with:
                  # vite.config.ts builds the version number from the commit count.
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Install dependencies
              run: |
                  corepack enable
                  yarn install --immutable

            - name: Lint and type-check
              run: |
                  yarn lint
                  yarn tsc -b

            - name: Unit tests
              run: yarn test:unit

            - name: Install the test browser
              run: yarn playwright install --with-deps chromium

            - name: Browser tests
              run: yarn test:e2e

            - name: Keep the browser test report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7
